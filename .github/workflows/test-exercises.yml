---
name: "Exercise tests"

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - '.github/workflows/test-exercises.yaml'
      - 'docker-tests/**'
      - 'exercises/**'
      - '!exercises/**/*.md'

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  testing:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Test intro-to-unit-tests
        run: podman build . -f docker-tests/Dockerfile.intro-to-unit-tests

      - name: Test refactoring-fortran
        run: podman build . -f docker-tests/Dockerfile.refactoring-fortran

      - name: Test writing-your-first-unit-test
        run: podman build . -f docker-tests/Dockerfile.writing-your-first-unit-test

      - name: Test fortran-unit-test-syntax
        run: podman build . -f docker-tests/Dockerfile.fortran-unit-test-syntax

      - name: Test debugging-a-failing-test
        run: podman build . -f docker-tests/Dockerfile.debugging-a-failing-test

      - name: Test testing-the-game-of-life-with-mpi
        run: podman build . -f docker-tests/Dockerfile.testing-the-game-of-life-with-mpi
