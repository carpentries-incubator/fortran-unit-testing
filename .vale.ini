StylesPath = .github/styles

# https://github.com/errata-ai/packages
Packages = proselint,\
           RedHat,\
           write-good

[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = proselint,\
                RedHat,\
                Vale,\
                write-good

# Disable
proselint.CurlyQuotes = NO
proselint.SpellingAbleAtable = NO
RedHat.Definitions = NO
RedHat.Ellipses = NO
RedHat.GitLinks = NO
RedHat.Headings = NO
RedHat.PascalCamelCase = NO
RedHat.PassiveVoice = NO
RedHat.ReadabilityGrade = NO
RedHat.Slash = NO
RedHat.Spelling = NO
RedHat.TermsErrors = NO
RedHat.SmartQuotes = NO
Vale.Spelling = NO
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.ThereIs = NO

# `vale sync` in CI means the packages are then linted, so turn them off
[.github/styles/**]
BasedOnStyles =

[.github/workflows/README.md]
BasedOnStyles =
